name: festival_notebook
description: A cross-platform local AI festival assistant built with Flutter and llamadart.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  llamadart: 0.12.2
  llamadart_llama_cpp_flutter: 0.0.23
  llamadart_stable_diffusion_flutter: 0.0.3
  audioplayers: 6.5.1
  path_provider: 2.1.5
  file_selector: 1.1.0
  record: 6.2.1
dev_dependencies:
  crypto: ^3.0.6
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/festival-cover.png
    - assets/question.wav
    - assets/mo-original.wav
    - assets/mo-alternate.wav

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp, stable_diffusion]
